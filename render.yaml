services:
  - type: web
    name: omniroom
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT --proxy-headers config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: ./backend
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:8080"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: USE_REDIS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: omniroom-db
          property: connectionString

databases:
  - name: omniroom-db
    plan: free
    region: oregon
