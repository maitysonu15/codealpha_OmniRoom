<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Room — OmniRoom</title>
  <meta name="description" content="OmniRoom Real-Time Collaborative Video Conference Room">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/meeting.css">
</head>
<body class="meeting-layout">

  <!-- Meeting Top Bar -->
  <header class="meeting-top-bar">
    <div class="meeting-brand">
      <a href="dashboard.html" class="brand-logo" style="font-size: 1.15rem;">
        <svg class="brand-logo-svg" width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="omGlossyLogoBgM" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="35%" stop-color="#6366f1"/>
              <stop offset="70%" stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#d946ef"/>
            </linearGradient>
            <linearGradient id="omGlossyGlassShineM" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
              <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="omGlossyLensGlowM" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="40%" stop-color="#e0e7ff"/>
              <stop offset="75%" stop-color="#c7d2fe"/>
              <stop offset="100%" stop-color="#818cf8"/>
            </radialGradient>
            <filter id="omGlossyShadowM" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
            </filter>
          </defs>
          <rect x="1" y="1" width="38" height="38" rx="12" fill="url(#omGlossyLogoBgM)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
          <path d="M2 13C2 6.92487 6.92487 2 13 2H27C33.0751 2 38 6.92487 38 13V18C38 18 29.5 22 20 22C10.5 22 2 18 2 18V13Z" fill="url(#omGlossyGlassShineM)"/>
          <g filter="url(#omGlossyShadowM)">
            <rect x="9" y="13" width="14" height="14" rx="4" fill="url(#omGlossyLensGlowM)"/>
            <circle cx="16" cy="20" r="4" fill="#4f46e5" opacity="0.85"/>
            <circle cx="16" cy="20" r="2.2" fill="#38bdf8"/>
            <circle cx="15.2" cy="19.2" r="0.9" fill="#ffffff"/>
            <path d="M23 16.5L30 12.2C30.6 11.8 31.4 12.2 31.4 13V27C31.4 27.8 30.6 28.2 30 27.8L23 23.5V16.5Z" fill="url(#omGlossyLensGlowM)"/>
            <path d="M24 17.5L30 13.8V17L24 19.5V17.5Z" fill="#ffffff" fill-opacity="0.45"/>
          </g>
        </svg>
        <span>Omni<span style="color: var(--primary);">Room</span></span>
      </a>
      <div class="meeting-title-box">
        <span class="meeting-title" id="display-meeting-name">Project Discussion</span>
        <div id="btn-copy-id" class="meeting-id-pill" data-tooltip="Click to Copy Code">
          <span>ID:</span>
          <strong id="display-meeting-code">...</strong>
          <svg class="svg-icon" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </div>
        <span class="meeting-timer" id="meeting-timer">00:00:00</span>
      </div>
    </div>

    <div class="meeting-status-indicators">
      <span class="status-badge status-secure" style="display: inline-flex; align-items: center; gap: 5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Secure
      </span>
      <span id="connection-status-badge" class="status-badge status-excellent">🟢 Excellent</span>
      <span id="participant-count-badge" class="badge badge-success" style="font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px;">
        <svg class="svg-icon" style="width: 13px; height: 13px;" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>1</span>
      </span>
      <button class="btn btn-ghost btn-sm" onclick="openModal('modal-meeting-info')" title="Meeting Info" style="display: inline-flex; align-items: center; gap: 4px;">
        <svg class="svg-icon" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Info</span>
      </button>
      <button class="btn btn-ghost btn-sm" onclick="openModal('modal-settings')" title="Settings" style="padding: 6px 8px;">
        <svg class="svg-icon" style="width: 16px; height: 16px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Workspace Area -->
  <div class="meeting-workspace">
    <!-- Video Stage -->
    <main class="video-stage" id="video-stage-main">
      <div id="video-grid" class="video-grid" data-count="1">
        <!-- Local User Video Tile -->
        <div class="video-tile" id="local-video-tile">
          <video id="local-video-element" autoplay playsinline muted style="display: none;"></video>
          <div class="video-avatar-fallback" id="local-user-avatar">U</div>
          <div class="video-tile-controls">
            <button class="tile-btn" onclick="togglePinTile('local-video-tile')" title="Pin Tile">
              <svg class="svg-icon" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </button>
            <button class="tile-btn" onclick="toggleFullscreenTile('local-video-tile')" title="Fullscreen">
              <svg class="svg-icon" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
          </div>
          <div class="participant-overlay" style="display: flex; align-items: center; gap: 6px;">
            <span id="local-mic-icon" class="mic-status-icon" style="display: flex; align-items: center;">
              <svg class="svg-icon" style="width: 14px; height: 14px; stroke: #10b981;" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            </span>
            <span id="local-user-name">You</span>
          </div>
        </div>
      </div>

      <!-- Floating Glossy Control Bar -->
      <div class="control-bar-wrapper">
        <div class="control-bar">
          <!-- Mic Toggle -->
          <button id="btn-toggle-mic" class="ctrl-btn active" data-tooltip="Microphone (M)">
            <svg id="svg-mic-icon" class="svg-icon" viewBox="0 0 24 24">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>

          <!-- Camera Toggle -->
          <button id="btn-toggle-cam" class="ctrl-btn active" data-tooltip="Camera (V)">
            <svg id="svg-cam-icon" class="svg-icon" viewBox="0 0 24 24">
              <polygon points="23 7 16 12 23 17 23 7"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </button>

          <!-- Screen Share -->
          <button id="btn-toggle-screen" class="ctrl-btn" data-tooltip="Share Screen">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
              <polyline points="16 9 12 5 8 9"/>
              <line x1="12" y1="5" x2="12" y2="13"/>
            </svg>
          </button>

          <!-- Chat -->
          <button id="btn-toggle-chat" class="ctrl-btn" data-tooltip="Chat">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <line x1="8" y1="9" x2="16" y2="9"/>
              <line x1="8" y1="13" x2="13" y2="13"/>
            </svg>
            <span id="chat-unread-badge" class="ctrl-badge-counter" style="display: none;">0</span>
          </button>

          <!-- Participants -->
          <button id="btn-toggle-people" class="ctrl-btn" data-tooltip="Participants">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </button>

          <!-- Shared Files -->
          <button id="btn-toggle-files" class="ctrl-btn" data-tooltip="Shared Files">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
              <line x1="12" y1="11" x2="12" y2="17"/>
              <polyline points="9 14 12 11 15 14"/>
            </svg>
          </button>

          <!-- Whiteboard -->
          <button id="btn-toggle-whiteboard" class="ctrl-btn" data-tooltip="Whiteboard Canvas">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <path d="M12 19l7-7 3 3-7 7-3-3z"/>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
              <path d="M2 2l7.586 7.586"/>
              <circle cx="11" cy="11" r="2"/>
            </svg>
          </button>

          <!-- Raise Hand -->
          <button id="btn-raise-hand" class="ctrl-btn" data-tooltip="Raise Hand">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v3"/>
              <path d="M14 9V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v7"/>
              <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
              <path d="M6 14v-2a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6a7 7 0 0 0 7 7h3a7 7 0 0 0 7-7v-6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v3"/>
            </svg>
          </button>

          <!-- Glossy Leave Button -->
          <button id="btn-leave-meeting" class="ctrl-btn ctrl-btn-leave" data-tooltip="Leave Call">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.8 19.8 0 0 1-3.12-8.68A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
              <line x1="23" y1="1" x2="1" y2="23"/>
            </svg>
            <span>Leave Call</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Side Drawer Panel (Chat / Participants / Files / Whiteboard) -->
    <aside id="drawer-panel" class="drawer-panel hidden">
      <div class="drawer-header">
        <h3 id="drawer-title" style="font-size: 1.05rem;">Side Panel</h3>
        <button id="btn-close-drawer" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <div id="drawer-content" class="drawer-content">
        <!-- Injected dynamically by meeting.js -->
      </div>
    </aside>
  </div>

  <!-- Modal: Meeting Info -->
  <div id="modal-meeting-info" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Meeting Information</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-meeting-info')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Meeting Name</label>
        <input type="text" id="info-meeting-title" class="form-input" readonly />
      </div>
      <div class="form-group">
        <label class="form-label">Meeting ID</label>
        <div class="input-wrapper">
          <input type="text" id="info-meeting-id" class="form-input" readonly style="font-family: var(--font-mono); font-weight: 700;" />
          <button type="button" class="btn btn-ghost btn-sm" style="position: absolute; right: 6px; display: inline-flex; align-items: center; gap: 4px;" onclick="copyInfoCode()">
            <svg class="svg-icon" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Copy</span>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Meeting Link</label>
        <div class="input-wrapper">
          <input type="text" id="info-meeting-link" class="form-input" readonly style="font-size: 0.85rem;" />
          <button type="button" class="btn btn-ghost btn-sm" style="position: absolute; right: 6px; display: inline-flex; align-items: center; gap: 4px;" onclick="copyInfoLink()">
            <svg class="svg-icon" style="width: 14px; height: 14px;" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span>Copy</span>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="closeModal('modal-meeting-info')">Done</button>
      </div>
    </div>
  </div>

  <!-- Modal: Leave Confirmation -->
  <div id="modal-confirm-leave" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Leave Call?</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-confirm-leave')">✕</button>
      </div>
      <p style="color: var(--text-secondary); margin-bottom: 20px;">
        Are you sure you want to exit this meeting room?
      </p>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-confirm-leave')">Stay in Call</button>
        <button type="button" id="btn-confirm-leave-action" class="btn btn-danger">Leave Meeting</button>
        <button type="button" id="btn-end-for-all" class="btn btn-danger" style="display: none;">End for Everyone</button>
      </div>
    </div>
  </div>

  <!-- Modal: Audio & Video Settings -->
  <div id="modal-settings" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Audio & Video Settings</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-settings')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Microphone Device</label>
        <select id="meeting-select-mic" class="form-input">
          <option>Default Microphone</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Camera Device</label>
        <select id="meeting-select-cam" class="form-input">
          <option>Default Camera</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="closeModal('modal-settings'); showToast('Settings applied.', 'success');">Done</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/meeting.js"></script>
</body>
</html>
